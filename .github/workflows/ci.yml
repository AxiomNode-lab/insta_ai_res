name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile source
        run: python -m compileall -q app tests

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  redis-integration:
    name: Redis atomicity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Redis integration tests
        env:
          PYTHONPATH: .
          RUN_REDIS_INTEGRATION: "1"
          REDIS_URL: redis://127.0.0.1:6379/15
        run: python -m pytest -q tests/test_redis_integration.py

  container:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, redis-integration]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --pull --tag ig-reply-desk:ci .
